<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WCE Bot — College Information Assistant</title>
  <meta name="description" content="WCE Bot: Ask questions about Walchand College of Engineering — fees, syllabus, admissions, and more. Powered by AI, grounded in official college documents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f14;
      --bg-card:     #13161e;
      --bg-glass:    rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.08);
      --accent:      #6c63ff;
      --accent-glow: rgba(108,99,255,0.35);
      --accent-dim:  rgba(108,99,255,0.15);
      --text:        #e8eaf0;
      --text-muted:  #7a7f96;
      --user-bubble: linear-gradient(135deg, #6c63ff, #9b6dff);
      --bot-bubble:  rgba(255,255,255,0.05);
      --bot-border:  rgba(108,99,255,0.25);
      --danger:      #ff5a5f;
      --success:     #4ade80;
      --cached:      #f59e0b;
      --radius-lg:   16px;
      --radius-md:   12px;
      --radius-sm:   8px;
      --shadow:      0 8px 32px rgba(0,0,0,0.5);
      --transition:  0.2s ease;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Animated background ────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(155,109,255,0.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Chat container ─────────────────────────────────────────────────── */
    #chat-container {
      position: relative;
      z-index: 1;
      width: min(680px, 96vw);
      height: min(750px, 96vh);
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow), 0 0 0 1px rgba(108,99,255,0.1);
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      background: var(--bg-glass);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #chat-header .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--user-bubble);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
      flex-shrink: 0;
    }

    #chat-header .info h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    #chat-header .info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      margin-left: auto;
      flex-shrink: 0;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Messages area ──────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Bubble base ────────────────────────────────────────────────────── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: bubble-in 0.25s ease forwards;
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    /* ── Source link ────────────────────────────────────────────────────── */
    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent-dim);
      border-radius: 6px;
      padding: 4px 10px;
      background: var(--accent-dim);
      transition: background var(--transition), border-color var(--transition);
    }
    .source-link:hover {
      background: rgba(108,99,255,0.3);
      border-color: var(--accent);
    }

    /* ── Cached badge ───────────────────────────────────────────────────── */
    .cached-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--cached);
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 6px;
      padding: 2px 8px;
      margin-top: 8px;
    }

    /* ── Typing indicator ───────────────────────────────────────────────── */
    #typing-indicator {
      display: none;
      align-self: flex-start;
      gap: 10px;
      align-items: center;
      animation: bubble-in 0.2s ease forwards;
    }

    #typing-indicator .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── Welcome prompt chips ───────────────────────────────────────────── */
    #prompt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 18px 4px;
    }

    .chip {
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      background: var(--accent-dim);
      border: 1px solid rgba(108,99,255,0.3);
      color: #b8b3ff;
      border-radius: 20px;
      padding: 6px 14px;
      transition: background var(--transition), color var(--transition), transform var(--transition);
    }
    .chip:hover {
      background: rgba(108,99,255,0.3);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ── Input area ─────────────────────────────────────────────────────── */
    #input-area {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-glass);
      flex-shrink: 0;
      align-items: flex-end;
    }

    #query-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #query-input::placeholder { color: var(--text-muted); }
    #query-input:focus {
      border-color: rgba(108,99,255,0.5);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    #send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--user-bubble);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    #send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    #send-btn:active:not(:disabled) { transform: translateY(0); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn svg { width: 20px; height: 20px; }

    /* ── Error toast ────────────────────────────────────────────────────── */
    #error-toast {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(255,90,95,0.15);
      border: 1px solid rgba(255,90,95,0.4);
      color: #ff8c8f;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 10;
    }
    #error-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      #chat-container { height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>

<div id="chat-container" role="main">

  <!-- Header -->
  <div id="chat-header">
    <div class="avatar" aria-hidden="true">🎓</div>
    <div class="info">
      <h1>WCE Bot</h1>
      <p>Walchand College of Engineering · Official Information Assistant</p>
    </div>
    <div id="status-dot" title="Service online" aria-label="Service online"></div>
  </div>

  <!-- Messages -->
  <div id="messages" role="log" aria-label="Chat messages" aria-live="polite">
    <div class="message bot" id="welcome-msg">
      <div class="bubble">
        👋 Hello! I'm <strong>WCE Bot</strong>. I can answer questions about<br>
        fees, syllabus, admissions, exam schedules, and more — all sourced directly from official college documents.<br><br>
        <em>What would you like to know?</em>
      </div>
    </div>
  </div>

  <!-- Typing indicator -->
  <div id="typing-indicator" class="message bot" role="status" aria-label="WCE Bot is typing">
    <div class="bubble">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <!-- Prompt chips -->
  <div id="prompt-chips" aria-label="Quick question suggestions">
    <button class="chip" id="chip-1" onclick="sendChip(this)">💰 Fee structure</button>
    <button class="chip" id="chip-2" onclick="sendChip(this)">📚 Syllabus for CS</button>
    <button class="chip" id="chip-3" onclick="sendChip(this)">📅 Admission deadlines</button>
    <button class="chip" id="chip-4" onclick="sendChip(this)">📄 Download prospectus</button>
  </div>

  <!-- Input -->
  <div id="input-area">
    <textarea
      id="query-input"
      placeholder="Ask about fees, syllabus, admissions…"
      rows="1"
      maxlength="500"
      aria-label="Type your question"
      onkeydown="handleKeydown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()" aria-label="Send message" title="Send (Enter)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Error toast -->
  <div id="error-toast" role="alert" aria-live="assertive"></div>

</div><!-- /chat-container -->

<script>
  // ── Configuration ──────────────────────────────────────────────────────────
  // Change this if the backend is hosted elsewhere.
  const API_BASE = "http://localhost:8000";

  // ── State ──────────────────────────────────────────────────────────────────
  let isLoading = false;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const messagesEl     = document.getElementById("messages");
  const inputEl        = document.getElementById("query-input");
  const sendBtn        = document.getElementById("send-btn");
  const typingEl       = document.getElementById("typing-indicator");
  const chipsEl        = document.getElementById("prompt-chips");
  const errorToastEl   = document.getElementById("error-toast");

  // ── Auto-resize textarea ───────────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  // ── Keyboard handler ───────────────────────────────────────────────────────
  function handleKeydown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Chip click ─────────────────────────────────────────────────────────────
  function sendChip(el) {
    const text = el.textContent.replace(/^[^\w]+/, "").trim();
    inputEl.value = text;
    sendMessage();
  }

  // ── Main send ─────────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isLoading) return;
    const query = inputEl.value.trim();
    if (!query) return;

    // Hide chips after first real question
    chipsEl.style.display = "none";

    // Render user bubble
    appendMessage("user", escapeHtml(query));

    // Clear input
    inputEl.value = "";
    inputEl.style.height = "auto";
    setLoading(true);

    try {
      const response = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      const data = await response.json();

      if (!response.ok) {
        // HTTP error (400, 429, 500 …)
        const detail = data.detail || `Error ${response.status}`;
        if (response.status === 429) {
          showError("⏱ Rate limit reached — please wait a moment before asking again.");
        } else if (response.status === 400) {
          showError("⚠ " + detail);
        } else {
          showError("Something went wrong. Please try again.");
        }
        return;
      }

      renderBotAnswer(data);

    } catch (err) {
      console.error(err);
      showError("🔌 Could not reach WCE Bot. Make sure the backend is running.");
    } finally {
      setLoading(false);
    }
  }

  // ── Render bot answer ──────────────────────────────────────────────────────
  function renderBotAnswer(data) {
    const { answer, source_url, cached } = data;

    let html = `<p>${escapeHtml(answer).replace(/\n/g, "<br>")}</p>`;

    if (source_url) {
      html += `
        <a class="source-link" href="${escapeAttr(source_url)}" target="_blank" rel="noopener noreferrer">
          📄 View source document
        </a>`;
    }

    if (cached) {
      html += `<div class="cached-badge">⚡ Cached response</div>`;
    }

    appendMessage("bot", html, true);
  }

  // ── Append a message bubble ────────────────────────────────────────────────
  function appendMessage(role, html, raw = false) {
    const wrapper = document.createElement("div");
    wrapper.className = `message ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (raw) {
      bubble.innerHTML = html;
    } else {
      bubble.textContent = html; // safe for user input
    }

    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  // ── Loading state ─────────────────────────────────────────────────────────
  function setLoading(state) {
    isLoading = state;
    sendBtn.disabled = state;
    inputEl.disabled = state;
    typingEl.style.display = state ? "flex" : "none";
    if (state) scrollToBottom();
  }

  // ── Error toast ────────────────────────────────────────────────────────────
  function showError(msg) {
    errorToastEl.textContent = msg;
    errorToastEl.classList.add("show");
    setTimeout(() => errorToastEl.classList.remove("show"), 4000);
  }

  // ── Scroll ─────────────────────────────────────────────────────────────────
  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // ── XSS helpers ────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttr(str) {
    // Only allow http/https URLs
    if (!/^https?:\/\//i.test(str)) return "#";
    return str.replace(/"/g, "&quot;");
  }
</script>

</body>
</html>
